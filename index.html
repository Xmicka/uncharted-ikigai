<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Uncharted Ikigai</title>
<meta name="description" content="Uncharted — find your AIESEC ikigai. A session by Akesh at NLDS'26." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#FBF6F0" id="themeColor" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FBF6F0;
    --bg2: #F5E3E0;
    --ink: #2B2326;
    --muted: #8C7A7D;
    --accent: #D8899A;
    --accent-ink: #B4596D;
    --line: rgba(43, 35, 38, .12);
    --field: rgba(255, 255, 255, .55);
    --btn: #2B2326;
    --btn-ink: #FBF6F0;
    --glow: rgba(216, 137, 154, .18);
    --dot: rgba(216, 137, 154, .14);
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  :root[data-theme="night"] {
    --bg: #0E0F26;
    --bg2: #1D1B42;
    --ink: #F3EBDD;
    --muted: #9C97B8;
    --accent: #E9B7C1;
    --accent-ink: #D6B371;
    --line: rgba(243, 235, 221, .14);
    --field: rgba(255, 255, 255, .04);
    --btn: #D6B371;
    --btn-ink: #0E0F26;
    --glow: rgba(214, 179, 113, .12);
    --dot: rgba(214, 179, 113, .09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    background: var(--bg);
  }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(circle, var(--dot) 1.6px, transparent 2px) 0 0 / 26px 26px,
      radial-gradient(circle, var(--dot) 1.6px, transparent 2px) 13px 13px / 26px 26px,
      radial-gradient(120% 70% at 50% 0%, var(--bg) 0%, transparent 70%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    overflow: hidden;
    transition: background-color .6s var(--ease), color .6s var(--ease);
  }

  button, a, [role="button"] {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    font: inherit;
    color: inherit;
  }
  input { font-size: 16px; font-family: var(--sans); color: var(--ink); }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed;
    inset: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity .5s var(--ease), transform .5s var(--ease), visibility 0s linear .5s;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity .6s var(--ease) .08s, transform .6s var(--ease) .08s, visibility 0s;
  }
  .wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .kicker {
    font-size: 11px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .display {
    font-family: var(--serif);
    font-weight: 600;
    letter-spacing: .06em;
    line-height: 1.05;
  }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    min-height: 54px;
    padding: 0 34px;
    background: var(--btn);
    color: var(--btn-ink);
    font-weight: 500;
    font-size: 16px;
    letter-spacing: .06em;
    cursor: pointer;
    transition: transform .14s var(--ease), opacity .3s var(--ease), background-color .6s var(--ease);
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .28; cursor: default; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .btn.wide { width: 100%; }
  .link {
    appearance: none; background: none; border: 0;
    color: var(--muted); font-size: 14px; letter-spacing: .04em;
    padding: 12px; cursor: pointer;
  }
  .link:active { opacity: .6; }

  @media (hover: hover) and (pointer: fine) {
    .btn:not([disabled]):hover { opacity: .88; }
    .link:hover { color: var(--ink); }
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    position: fixed;
    z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 14px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--line);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .14s var(--ease);
  }
  .theme-toggle:active { transform: scale(.92); }
  .theme-toggle svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; }
  :root[data-theme="night"] .theme-toggle .sun { display: none; }
  :root:not([data-theme="night"]) .theme-toggle .moon { display: none; }

  /* ---------- 1 · Welcome ---------- */
  #welcome .title { font-size: clamp(36px, 11.2vw, 64px); letter-spacing: .05em; margin: 28px 0 30px; }
  #welcome .by { color: var(--muted); font-size: 15px; }
  #welcome .by b { color: var(--ink); font-weight: 500; }
  #welcome .event { margin-top: 10px; }
  #welcome .btn { margin-top: 64px; }
  .mark { width: 30px; height: 30px; fill: var(--accent); }

  .drift {
    position: fixed;
    top: 0; left: 0;
    width: 22px; height: 22px;
    pointer-events: none;
    opacity: 0;
    fill: var(--accent);
  }
  #welcome.active .drift { animation: drift 9s cubic-bezier(.45, .05, .55, .95) .5s 1 forwards; }
  @keyframes drift {
    0%   { opacity: 0;  transform: translate(-30px, 12vh) rotate(-20deg); }
    10%  { opacity: .9; }
    30%  { transform: translate(28vw, 26vh) rotate(40deg); }
    55%  { transform: translate(52vw, 34vh) rotate(110deg); }
    80%  { opacity: .9; transform: translate(80vw, 50vh) rotate(170deg); }
    100% { opacity: 0;  transform: translate(105vw, 60vh) rotate(220deg); }
  }

  /* ---------- 2 · Identify ---------- */
  #identify h2 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.2; margin: 14px 0 36px; }
  .field { width: 100%; text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 4px; }
  .field input {
    width: 100%;
    height: 54px;
    padding: 0 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--field);
    outline: none;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .field input::placeholder { color: var(--muted); opacity: .6; }
  #identify .btn { margin-top: 20px; }

  /* ---------- 3 · Loading ---------- */
  #loading { background: radial-gradient(80% 60% at 50% 45%, var(--glow), transparent 70%); }
  .bloom { width: 132px; height: 132px; overflow: visible; }
  .bloom .p {
    fill: var(--accent);
    transform-box: view-box;
    transform-origin: 0 0;
    opacity: 0;
  }
  #loading.active .bloom .p { animation: bloom 2.8s var(--ease) infinite; animation-delay: calc(var(--i) * 90ms); }
  .bloom .core { fill: var(--accent-ink); opacity: .75; }
  .bloom-g { transform-box: view-box; transform-origin: 0 0; }
  #loading.active .bloom-g { animation: turn 2.8s linear infinite; }
  @keyframes bloom {
    0%   { opacity: 0; transform: scale(.2); }
    35%  { opacity: .92; transform: scale(1); }
    78%  { opacity: .92; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.06); }
  }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(36deg); } }
  #loading p { margin-top: 36px; font-family: var(--serif); font-size: 19px; color: var(--muted); letter-spacing: .04em; }

  /* ---------- 4 · Ikigai ---------- */
  .dots { display: flex; gap: 8px; margin-bottom: 30px; }
  .dots i { width: 6px; height: 6px; border-radius: 6px; background: var(--line); transition: width .4s var(--ease), background-color .4s var(--ease); }
  .dots i.on { background: var(--accent); }
  .dots i.now { width: 22px; background: var(--accent); }

  .frame {
    width: min(84vw, 340px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: radial-gradient(circle at 50% 35%, var(--glow), transparent 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 12%;
  }
  .q { transition: opacity .28s var(--ease), transform .28s var(--ease); display: flex; flex-direction: column; align-items: center; width: 100%; }
  .q.out { opacity: 0; transform: translateY(6px); }
  .q .kicker { margin-bottom: 14px; }
  .q h3 { font-family: var(--serif); font-weight: 600; font-size: clamp(19px, 5.4vw, 22px); line-height: 1.35; margin-bottom: 22px; }
  .q input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: center;
    padding: 8px 4px;
    outline: none;
    border-radius: 0;
    transition: border-color .2s var(--ease);
  }
  .q input:focus { border-color: var(--accent); }
  .q input::placeholder { color: var(--muted); opacity: .55; }
  .count { font-size: 11px; color: var(--muted); opacity: .7; margin-top: 8px; height: 14px; }
  #ikigai .actions { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* ---------- 5 · Result ---------- */
  #result { justify-content: flex-start; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #result .wrap { padding: 28px 0 8px; }
  #result .kicker { margin-bottom: 18px; }
  .card {
    width: min(100%, 330px);
    aspect-ratio: 9 / 16;
    border-radius: 20px;
    box-shadow: 0 1px 0 var(--line), 0 24px 60px -24px rgba(60, 20, 40, .35);
    background: var(--bg2);
    display: block;
    -webkit-touch-callout: default;
  }
  .row { display: flex; gap: 10px; width: 100%; margin-top: 24px; }
  .row .btn { flex: 1; padding: 0 12px; }
  .note {
    font-size: 14px; color: var(--muted); margin-top: 14px; min-height: 0;
    line-height: 1.5;
  }
  .note:empty { display: none; }
  .note strong { color: var(--ink); font-weight: 500; }
  .caption {
    width: 100%;
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--field);
    text-align: left;
  }
  .caption .kicker { margin-bottom: 8px !important; font-size: 10px; }
  .caption p { font-size: 14px; line-height: 1.55; user-select: text; -webkit-user-select: text; }
  .caption button { margin-top: 10px; padding: 0; font-size: 13px; color: var(--accent-ink); background: none; border: 0; cursor: pointer; letter-spacing: .04em; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 14px; opacity: .8; }

  @media (prefers-reduced-motion: reduce) {
    .screen, .screen.active, .q { transition-duration: .01s !important; transform: none !important; }
    #welcome.active .drift { animation: none; }
    #loading.active .bloom .p { animation: none; opacity: .92; transform: none; }
    #loading.active .bloom-g { animation: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="petal" d="M0 0 C-27.5 -12.5 -24.75 -42.5 -6 -50 L0 -43 L6 -50 C24.75 -42.5 27.5 -12.5 0 0Z" />
    <g id="flower">
      <use href="#petal" transform="rotate(0)" />
      <use href="#petal" transform="rotate(72)" />
      <use href="#petal" transform="rotate(144)" />
      <use href="#petal" transform="rotate(216)" />
      <use href="#petal" transform="rotate(288)" />
    </g>
  </defs>
</svg>

<button class="theme-toggle" id="themeToggle" aria-label="Switch between day and night">
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
</button>

<!-- 1 · Welcome -->
<section class="screen active" id="welcome" aria-label="Welcome">
  <svg class="drift" viewBox="-30 -55 60 60" aria-hidden="true"><use href="#petal" /></svg>
  <div class="wrap">
    <svg class="mark" viewBox="-55 -55 110 110" aria-hidden="true"><use href="#flower" /></svg>
    <h1 class="display title">UNCHARTED</h1>
    <p class="by">a session by <b>Akesh</b> · @_akesh_02</p>
    <p class="kicker event">NLDS'26</p>
    <button class="btn" data-go="identify">Begin</button>
  </div>
</section>

<!-- 2 · Identify -->
<section class="screen" id="identify" aria-label="Tell us who you are">
  <form class="wrap" id="idForm" autocomplete="off" novalidate>
    <p class="kicker">Before we begin</p>
    <h2>Tell us who's here</h2>
    <div class="field">
      <label for="fname">First name</label>
      <input id="fname" maxlength="20" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="Your first name" />
    </div>
    <div class="field">
      <label for="entity">Entity</label>
      <input id="entity" maxlength="26" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="e.g. AIESEC in Colombo South" />
    </div>
    <button class="btn wide" id="idNext" type="submit" disabled>Continue</button>
  </form>
</section>

<!-- 3 · Loading -->
<section class="screen" id="loading" aria-label="Loading" aria-live="polite">
  <svg class="bloom" viewBox="-60 -60 120 120" aria-hidden="true">
    <g class="bloom-g">
      <g transform="rotate(0)"><use class="p" href="#petal" style="--i:0" /></g>
      <g transform="rotate(72)"><use class="p" href="#petal" style="--i:1" /></g>
      <g transform="rotate(144)"><use class="p" href="#petal" style="--i:2" /></g>
      <g transform="rotate(216)"><use class="p" href="#petal" style="--i:3" /></g>
      <g transform="rotate(288)"><use class="p" href="#petal" style="--i:4" /></g>
      <circle class="core" r="5" />
    </g>
  </svg>
  <p>finding your rung…</p>
</section>

<!-- 4 · Ikigai -->
<section class="screen" id="ikigai" aria-label="Your ikigai">
  <form class="wrap" id="qForm" autocomplete="off" novalidate>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="frame">
      <div class="q" id="q">
        <p class="kicker" id="qNum">01 / 04</p>
        <h3 id="qText"></h3>
        <input id="qInput" maxlength="40" autocorrect="on" enterkeyhint="next" placeholder="one line is enough" aria-labelledby="qText" />
        <p class="count" id="qCount"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="qNext" type="submit" disabled>Next</button>
      <button class="link" id="qBack" type="button">Back</button>
    </div>
  </form>
</section>

<!-- 5 · Result -->
<section class="screen" id="result" aria-label="Your keepsake card">
  <div class="wrap">
    <p class="kicker">Your keepsake</p>
    <img class="card" id="cardImg" alt="Your Uncharted ikigai card" />
    <div class="row">
      <button class="btn ghost" id="saveBtn">Save</button>
      <button class="btn" id="shareBtn">Share</button>
    </div>
    <p class="note" id="note"></p>
    <div class="caption">
      <p class="kicker">Caption</p>
      <p id="captionText"></p>
      <button id="copyBtn">Copy caption</button>
    </div>
    <p class="hint">Tip: you can also press and hold the card to save it.</p>
    <button class="link" id="restart" style="margin-top:8px">Start again</button>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CAPTION = "my AIESEC ikigai 🌸 found at Uncharted, NLDS'26 #Uncharted #NLDS26 @_akesh_02 @mc.srilanka";
  const QUESTIONS = [
    { q: "What part of AIESEC lights you up?",          label: "LIGHTS ME UP" },
    { q: "What's something you're already good at?",    label: "GOOD AT" },
    { q: "What does AIESEC need more of right now?",     label: "AIESEC NEEDS" },
    { q: "Where do you want to be recognised for it?",  label: "RECOGNISED IN" },
  ];
  const state = { name: "", entity: "", answers: ["", "", "", ""], step: 0, file: null, url: null };

  /* ---------- Theme ---------- */
  const root = document.documentElement;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  function applyTheme(t) {
    root.dataset.theme = t;
    $("themeColor").setAttribute("content", t === "night" ? "#0E0F26" : "#FBF6F0");
  }
  const saved = store.get("uncharted-theme");
  applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"));
  $("themeToggle").addEventListener("click", () => {
    const t = root.dataset.theme === "night" ? "day" : "night";
    applyTheme(t);
    store.set("uncharted-theme", t);
    if ($("result").classList.contains("active")) renderCard();
  });

  /* ---------- Navigation ---------- */
  function go(id) {
    document.querySelectorAll(".screen.active").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    if (id === "identify") setTimeout(() => $("fname").focus({ preventScroll: true }), 450);
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));

  /* ---------- Identify ---------- */
  const fname = $("fname"), entity = $("entity");
  const idValid = () => fname.value.trim() && entity.value.trim();
  [fname, entity].forEach((el) => el.addEventListener("input", () => ($("idNext").disabled = !idValid())));
  fname.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); entity.focus(); } });
  $("idForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!idValid()) return;
    state.name = fname.value.trim();
    state.entity = entity.value.trim();
    document.activeElement.blur();
    go("loading");
    fontsReady(); // warm up fonts for the card while the bloom plays
    setTimeout(() => { showQuestion(0, false); go("ikigai"); }, 2800);
  });

  /* ---------- Ikigai ---------- */
  const qInput = $("qInput");
  function showQuestion(i, animate = true) {
    const paint = () => {
      state.step = i;
      $("qNum").textContent = String(i + 1).padStart(2, "0") + " / 04";
      $("qText").textContent = QUESTIONS[i].q;
      qInput.value = state.answers[i];
      $("qNext").textContent = i === 3 ? "Reveal" : "Next";
      qInput.setAttribute("enterkeyhint", i === 3 ? "done" : "next");
      $("qBack").style.visibility = i === 0 ? "hidden" : "visible";
      [...$("dots").children].forEach((d, k) => {
        d.className = k < i ? "on" : k === i ? "now" : "";
      });
      updateQ();
      $("q").classList.remove("out");
    };
    if (!animate) return paint();
    $("q").classList.add("out");
    setTimeout(paint, 220);
  }
  function updateQ() {
    const len = qInput.value.length;
    $("qNext").disabled = !qInput.value.trim();
    $("qCount").textContent = len > 28 ? `${40 - len} left` : "";
  }
  qInput.addEventListener("input", updateQ);
  $("qForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = qInput.value.trim();
    if (!v) return;
    state.answers[state.step] = v;
    if (state.step < 3) {
      showQuestion(state.step + 1);
    } else {
      qInput.blur();
      reveal();
    }
  });
  $("qBack").addEventListener("click", () => {
    state.answers[state.step] = qInput.value.trim();
    if (state.step > 0) showQuestion(state.step - 1);
  });

  /* ---------- Card rendering ---------- */
  const W = 1080, H = 1920;
  const PETAL = new Path2D("M0 0 C-27.5 -12.5 -24.75 -42.5 -6 -50 L0 -43 L6 -50 C24.75 -42.5 27.5 -12.5 0 0Z");
  const WING_UP = new Path2D("M0 -2 C-6 -26 -34 -40 -42 -24 C-48 -10 -30 2 0 2Z");
  const WING_LO = new Path2D("M0 0 C-8 6 -30 12 -28 28 C-24 40 -6 24 0 2Z");

  let fontsPromise;
  function fontsReady() {
    if (!fontsPromise) {
      fontsPromise = Promise.all([
        document.fonts.load('600 64px "Shippori Mincho"', "UNCHARTED 生き甲斐"),
        document.fonts.load('500 30px "M PLUS Rounded 1c"'),
        document.fonts.load('400 30px "M PLUS Rounded 1c"'),
      ]).catch(() => {});
      // never let a slow venue network block the card
      fontsPromise = Promise.race([fontsPromise, new Promise((r) => setTimeout(r, 2500))]);
    }
    return fontsPromise;
  }

  const SERIF = '"Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif';
  const SANS = '"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif';

  function palette(night) {
    return night ? {
      top: "#0E0F26", bottom: "#221F4A", ink: "#F3EBDD", muted: "#A39FBF", accent: "#E9B7C1", gold: "#D6B371",
      fills: ["rgba(233,183,193,.20)", "rgba(214,179,113,.18)", "rgba(150,160,230,.18)", "rgba(200,170,230,.18)"],
      stroke: "rgba(214,179,113,.55)", blend: "screen", petal: "rgba(233,183,193,.35)",
      blob: "rgba(233,183,193,.10)", dot: "rgba(214,179,113,.10)",
      ticket: "rgba(255,255,255,.06)", stub: "rgba(233,183,193,.14)", bloom: "#E9B7C1",
      seal: "#E9A3B2", twig: "rgba(214,179,113,.45)", blossom: "rgba(233,183,193,.85)",
    } : {
      top: "#FBF6F0", bottom: "#F4DCDA", ink: "#2B2326", muted: "#8C7A7D", accent: "#C9768A", gold: "#C9768A",
      fills: ["rgba(242,170,185,.38)", "rgba(246,206,170,.42)", "rgba(190,210,205,.45)", "rgba(214,196,232,.42)"],
      stroke: "rgba(43,35,38,.14)", blend: "multiply", petal: "rgba(216,137,154,.32)",
      blob: "rgba(242,170,185,.28)", dot: "rgba(216,137,154,.13)",
      ticket: "rgba(255,255,255,.78)", stub: "rgba(242,170,185,.22)", bloom: "#E496A8",
      seal: "#C9576E", twig: "rgba(120,78,84,.38)", blossom: "rgba(236,154,174,.9)",
    };
  }

  function spaced(ctx, text, x, y, spacing) {
    // letter-spaced text, centred on x (manual so it works on every browser)
    const chars = [...text];
    const widths = chars.map((c) => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let cx = x - total / 2;
    const prev = ctx.textAlign;
    ctx.textAlign = "left";
    chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + spacing; });
    ctx.textAlign = prev;
    return total;
  }

  function wrap(ctx, text, maxW, maxLines) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width <= maxW) { line = test; continue; }
      if (line) lines.push(line);
      line = w;
      while (ctx.measureText(line).width > maxW) { // break a single very long word
        let cut = line.length - 1;
        while (cut > 1 && ctx.measureText(line.slice(0, cut) + "-").width > maxW) cut--;
        lines.push(line.slice(0, cut) + "-");
        line = line.slice(cut);
      }
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) {
      lines.length = maxLines;
      let last = lines[maxLines - 1];
      while (last && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
      lines[maxLines - 1] = last.trimEnd() + "…";
    }
    return lines;
  }

  function fitFont(ctx, text, weight, size, family, maxW) {
    do { ctx.font = `${weight} ${size}px ${family}`; } while (ctx.measureText(text).width > maxW && (size -= 2) > 28);
    return size;
  }

  function petal(ctx, x, y, s, rot, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.fillStyle = color; ctx.fill(PETAL); ctx.restore();
  }
  function flower(ctx, x, y, s, color) {
    for (let i = 0; i < 5; i++) petal(ctx, x, y, s, (i * 72 * Math.PI) / 180, color);
  }
  function blob(ctx, x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function mizutama(ctx, color) {
    // polka-dot stationery pattern, kept very faint
    ctx.fillStyle = color;
    for (let row = 0, y = 30; y < H; row++, y += 60) {
      for (let x = row % 2 ? 60 : 30; x < W; x += 60) {
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  function sparkle(ctx, x, y, s, color) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = color; ctx.globalAlpha = .75;
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
    ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
    ctx.fill(); ctx.restore();
  }
  function branch(ctx, P, dir, ox, oy, fromBottom, k = 1) {
    // a slim sakura twig entering from a corner; dir mirrors it horizontally
    const sy = fromBottom ? -1 : 1;
    const pt = (x, y) => [ox - dir * x * k, oy + sy * y * k];
    ctx.save();
    ctx.strokeStyle = P.twig; ctx.lineCap = "round";
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(...pt(-10, 20)); ctx.quadraticCurveTo(...pt(110, 40), ...pt(250, 120)); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(...pt(120, 50)); ctx.quadraticCurveTo(...pt(150, 110), ...pt(140, 165)); ctx.stroke();
    ctx.restore();
    [[250, 120, .6], [140, 165, .5], [70, 40, .42]].forEach(([x, y, s]) => {
      const [fx, fy] = pt(x, y);
      flower(ctx, fx, fy, s * k, P.blossom);
      ctx.beginPath(); ctx.arc(fx, fy, 5 * k * s / .5, 0, Math.PI * 2); ctx.fillStyle = P.gold; ctx.fill();
    });
    [[200, 70], [100, 95]].forEach(([x, y]) => { // buds
      const [bx, by] = pt(x, y);
      ctx.beginPath(); ctx.ellipse(bx, by, 8 * k, 11 * k, dir * .6, 0, Math.PI * 2); ctx.fillStyle = P.blossom; ctx.fill();
    });
  }
  function ticketPath(ctx, x, y, w, h, r, n, px) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(px - n, y); ctx.arc(px, y, n, Math.PI, 0, true);
    ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(px + n, y + h); ctx.arc(px, y + h, n, 0, Math.PI, true);
    ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function hanko(ctx, x, y, r, rot, color) {
    // a round seal, as if stamped on the ticket corner
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.globalAlpha = .9;
    ctx.fillStyle = color; ctx.strokeStyle = color;
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, r - 9, 0, Math.PI * 2); ctx.stroke();
    ctx.textAlign = "center";
    ctx.font = `700 24px ${SANS}`;
    spaced(ctx, "NLDS", 0, 0, 3);
    ctx.font = `600 30px ${SERIF}`;
    ctx.fillText("'26", 0, 32);
    flower(ctx, 0, -41, .14, color);
    ctx.restore();
  }
  function butterfly(ctx, x, y, s, rot, color) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.fillStyle = color;
    ctx.globalAlpha = .9;  ctx.fill(WING_UP); ctx.fill(WING_LO);
    ctx.scale(-1, 1);       ctx.fill(WING_UP); ctx.fill(WING_LO);
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.ellipse(0, 4, 2.4, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(-1, -14); ctx.quadraticCurveTo(-6, -26, -12, -30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, -14);  ctx.quadraticCurveTo(6, -26, 12, -30);  ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const night = root.dataset.theme === "night";
    const P = palette(night);
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    // Background
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, P.top); g.addColorStop(1, P.bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W / 2, 1000, 0, W / 2, 1000, 700);
    glow.addColorStop(0, night ? "rgba(214,179,113,.10)" : "rgba(255,255,255,.55)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // Cutesy-but-quiet stationery details
    blob(ctx, 140, 260, 460, P.blob);
    blob(ctx, 960, 1660, 520, P.blob);
    mizutama(ctx, P.dot);
    branch(ctx, P, 1, 1080, -24, false, .78); // top-right, peeking in
    branch(ctx, P, -1, 0, H, true);   // bottom-left, rising up
    petal(ctx, 110, 560, .8, -0.5, P.petal);
    petal(ctx, 975, 470, .6, 0.9, P.petal);
    petal(ctx, 80, 1480, .65, 2.2, P.petal);
    petal(ctx, 1000, 1290, .7, -2.6, P.petal);
    [[175, 640, 13], [905, 610, 10], [120, 1330, 9], [960, 1440, 13], [770, 1530, 7]]
      .forEach(([x, y, s]) => sparkle(ctx, x, y, s, P.gold));

    // Credential: a little ticket with a sakura stub + hanko seal
    const tw = 680, th = 200, tx = (W - tw) / 2, ty = 112, perf = tx + 160;
    ctx.save();
    ctx.shadowColor = night ? "rgba(0,0,0,.35)" : "rgba(180,90,110,.18)";
    ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    ticketPath(ctx, tx, ty, tw, th, 26, 20, perf);
    ctx.fillStyle = P.ticket; ctx.fill();
    ctx.restore();
    ctx.save();
    ticketPath(ctx, tx, ty, tw, th, 26, 20, perf); ctx.clip();
    ctx.fillStyle = P.stub; ctx.fillRect(tx, ty, perf - tx, th);
    ctx.restore();
    ticketPath(ctx, tx, ty, tw, th, 26, 20, perf);
    ctx.strokeStyle = P.gold; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.setLineDash([1, 11]); ctx.lineCap = "round"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(perf, ty + 30); ctx.lineTo(perf, ty + th - 28); ctx.stroke();
    ctx.restore();
    flower(ctx, (tx + perf) / 2, ty + th / 2, .62, P.bloom);
    ctx.beginPath(); ctx.arc((tx + perf) / 2, ty + th / 2, 6, 0, Math.PI * 2);
    ctx.fillStyle = P.gold; ctx.fill();

    const mid = (perf + tx + tw) / 2;
    ctx.font = `500 22px ${SANS}`;
    ctx.fillStyle = P.muted;
    spaced(ctx, "I WAS AT", mid, ty + 78, 9);
    ctx.font = `600 54px ${SERIF}`;
    ctx.fillStyle = P.ink;
    spaced(ctx, "UNCHARTED", mid - 6, ty + 148, 5);

    hanko(ctx, tx + tw + 2, ty + th + 4, 62, -0.22, P.seal);

    // Name · Entity
    const who = `${state.name} · ${state.entity}`;
    fitFont(ctx, who, 600, 66, SERIF, 940);
    ctx.fillStyle = P.ink;
    ctx.fillText(who, W / 2, 470);

    // My Ikigai
    ctx.font = `600 38px ${SERIF}`;
    ctx.fillStyle = P.accent;
    spaced(ctx, "My Ikigai", W / 2, 560, 4);

    // Four circles
    const cx = W / 2, cy = 1030, r = 262, d = 172;
    const centers = [[cx, cy - d], [cx - d, cy], [cx + d, cy], [cx, cy + d]];
    ctx.save();
    ctx.globalCompositeOperation = P.blend;
    centers.forEach(([x, y], i) => {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = P.fills[i]; ctx.fill();
    });
    ctx.restore();
    ctx.strokeStyle = P.stroke; ctx.lineWidth = 1.5;
    centers.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); });

    // Answers in each circle's outer lobe
    const slots = [
      { x: cx,           y: cy - d - 150, w: 380, lines: 3 }, // top
      { x: cx - d - 128, y: cy - 12,      w: 205, lines: 4 }, // left
      { x: cx + d + 128, y: cy - 12,      w: 205, lines: 4 }, // right
      { x: cx,           y: cy + d + 120, w: 380, lines: 3 }, // bottom
    ];
    slots.forEach((s, i) => {
      ctx.font = `500 30px ${SANS}`;
      const lines = wrap(ctx, state.answers[i], s.w, s.lines);
      const lh = 38;
      const blockH = 34 + lines.length * lh;
      let y = s.y - blockH / 2 + 20;
      ctx.font = `500 17px ${SANS}`;
      ctx.fillStyle = P.muted;
      spaced(ctx, QUESTIONS[i].label, s.x, y, 4);
      y += 46;
      ctx.font = `500 30px ${SANS}`;
      ctx.fillStyle = P.ink;
      lines.forEach((l) => { ctx.fillText(l, s.x, y); y += lh; });
    });

    // Centre mark
    ctx.font = `600 34px ${SERIF}`;
    ctx.fillStyle = P.ink;
    ctx.fillText("生き甲斐", cx, cy + 12);

    // Butterfly signature
    butterfly(ctx, W / 2, 1520, 1.15, -0.18, P.gold);
    const date = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    ctx.font = `500 32px ${SERIF}`;
    ctx.fillStyle = P.muted;
    ctx.fillText(`your butterfly moment, dated ${date}.`, W / 2, 1612);

    // Footer
    ctx.strokeStyle = P.stroke; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W / 2 - 60, 1738); ctx.lineTo(W / 2 + 60, 1738); ctx.stroke();
    ctx.font = `400 28px ${SANS}`;
    ctx.fillStyle = P.muted;
    ctx.fillText("🌸 @_akesh_02 · @mc.srilanka", W / 2, 1808);

    return c;
  }

  async function renderCard() {
    await fontsReady();
    const canvas = draw();
    const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
    if (state.url) URL.revokeObjectURL(state.url);
    state.url = URL.createObjectURL(blob);
    const safe = state.name.replace(/[^\w-]+/g, "").toLowerCase() || "my";
    state.file = new File([blob], `uncharted-ikigai-${safe}.png`, { type: "image/png" });
    $("cardImg").src = state.url;
  }

  async function reveal() {
    $("note").textContent = "";
    await renderCard();
    go("result");
    $("result").scrollTop = 0;
  }

  /* ---------- Save / Share ---------- */
  function save() {
    if (!state.url) return;
    const a = document.createElement("a");
    a.href = state.url;
    a.download = state.file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function copyCaption() {
    const done = () => { $("copyBtn").textContent = "Copied ✓"; setTimeout(() => ($("copyBtn").textContent = "Copy caption"), 2000); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(CAPTION).then(done, fallbackCopy);
    } else fallbackCopy();
    function fallbackCopy() {
      const ta = document.createElement("textarea");
      ta.value = CAPTION; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch {}
      ta.remove();
    }
  }

  $("saveBtn").addEventListener("click", () => {
    save();
    $("note").innerHTML = "<strong>Saved.</strong> Check your downloads or photos.";
  });

  $("shareBtn").addEventListener("click", () => {
    const data = { files: [state.file], title: "My AIESEC ikigai", text: CAPTION };
    const canShareFiles = state.file && navigator.canShare && navigator.canShare({ files: [state.file] });
    if (canShareFiles) {
      copyCaption(); // so the caption is ready to paste into the story / post
      navigator.share(data).then(
        () => { $("note").innerHTML = "<strong>Shared.</strong> Caption is copied — paste it in."; },
        (err) => { if (err && err.name !== "AbortError") fallback(); }
      );
    } else fallback();

    function fallback() {
      save();
      copyCaption();
      $("note").innerHTML = "<strong>Image saved</strong> — now share it from your gallery. The caption below is copied for you.";
    }
  });

  $("copyBtn").addEventListener("click", copyCaption);
  $("captionText").textContent = CAPTION;

  $("restart").addEventListener("click", () => {
    state.answers = ["", "", "", ""];
    fname.value = ""; entity.value = "";
    $("idNext").disabled = true;
    go("welcome");
  });
})();
</script>
